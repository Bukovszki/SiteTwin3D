# Routing by host name: names starting with "mapmanager." go to MapManager's web server, everything else to this
# application's ("sitetwin3d.…"). The names are not written here, so the same file serves sslip.io names
# (sitetwin3d.203-0-113-10.sslip.io) and a real domain later. The applications' web servers are found by their aliases
# on the "edge" network (deploy/edge/twin.yml, mapmanager.yml); resolved per connection, so the entry point starts
# and keeps running even if one application is down. __RESOLVER__ is the container's DNS server (from /etc/resolv.conf
# at start: 127.0.0.11 under Docker, another address under Podman), filled in by the command in docker-compose.yml.
worker_processes auto;

events {
    worker_connections 4096;
}

# HTTPS: the TLS connection is passed on unopened, chosen by its server name (SNI).
stream {
    resolver __RESOLVER__ valid=10s ipv6=off;

    map $ssl_preread_server_name $tls_upstream {
        ~^mapmanager\.  mapmanager-web:443;
        default         twin-web:443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $tls_upstream;
        proxy_connect_timeout 5s;
        # Long uploads and processing (large models, SHP ZIPs) keep a connection open for minutes.
        proxy_timeout 1h;
    }
}

# HTTP: certificate challenges (Let's Encrypt) and the redirect to HTTPS are answered by each application itself.
http {
    resolver __RESOLVER__ valid=10s ipv6=off;
    access_log off;

    map $host $http_upstream {
        ~^mapmanager\.  mapmanager-web;
        default         twin-web;
    }

    server {
        listen 80 default_server;
        client_max_body_size 0;
        location / {
            proxy_pass http://$http_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
