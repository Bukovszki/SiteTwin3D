# Full deployment on one Linux server (Docker Compose v2), following the MapManager deployment pattern.
#
#   internet ──443/80──▶ web (Caddy: HTTPS, Angular UI)
#                          ├─ /api/*, /health ─▶ api (.NET) ─▶ db (PostgreSQL + PostGIS + ltree)
#                          │                               └─▶ storage (S3, metadata only; NFR-3)
#                          └─ /objects/* (signed URLs) ─▶ storage
#
# Only web is reachable from outside. Settings: .env (template: .env.example).
# Start: docker compose up -d --build   (local machine: see docker-compose.local.yml)

name: twin

# Container logs (docker logs) are capped at 3 × 20 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    logging: *logging
    # Multi-arch PostGIS image (also on Apple Silicon); ltree is part of the PostgreSQL contrib modules.
    image: ${POSTGIS_IMAGE:-docker.io/kartoza/postgis:16-3.4}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DBNAME: appdb
      # Password authentication from the internal compose network.
      ALLOW_IP_RANGE: 0.0.0.0/0
      PASSWORD_AUTHENTICATION: scram-sha-256
    shm_size: 1g
    volumes:
      # The kartoza image writes under /var/lib/postgresql/16/main.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER:-postgres} -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [backend]

  storage:
    logging: *logging
    # S3-compatible object store. MinIO no longer publishes free container images, so SeaweedFS is the default;
    # any S3-compatible server can replace it (the API only speaks S3).
    image: ${STORAGE_IMAGE:-docker.io/chrislusf/seaweedfs:4.48}
    restart: unless-stopped
    # 1 GB volumes (the default 30 GB would not fit on a small disk: "no free volumes left"), at most STORAGE_MAX_VOLUMES.
    command: server -dir=/data -s3 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=${STORAGE_MAX_VOLUMES:-100}
    environment:
      # The S3 admin identity (the API uses it to sign URLs).
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
    volumes:
      - objects:/data
    # web (Caddy) forwards the signed URLs (/media/*) to it.
    networks: [backend, frontend]

  api:
    logging: *logging
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: twin-api:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=db;Port=5432;Database=appdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      # The first platform admin (only if none exists; password change at first sign-in, organization = "platform").
      Platform__AdminUsername: ${PLATFORM_ADMIN_USER:-admin}
      Platform__AdminPassword: ${PLATFORM_ADMIN_PASSWORD:?Set PLATFORM_ADMIN_PASSWORD in .env}
      Storage__Endpoint: http://storage:8333
      Storage__AccessKey: ${STORAGE_ACCESS_KEY}
      Storage__SecretKey: ${STORAGE_SECRET_KEY}
      # The address the browser uses (signed URLs point here; Caddy forwards /objects/* to the object store).
      Storage__PublicUrl: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      Storage__MaxPanoramaMb: ${MAX_PANORAMA_MB:-300}
      Storage__MaxModelMb: ${MAX_MODEL_MB:-4096}
      # Housekeeping of the object store: unreferenced files after the grace period, expired panorama originals.
      Cleanup__IntervalHours: ${CLEANUP_INTERVAL_HOURS:-6}
      Cleanup__OrphanGraceHours: ${CLEANUP_GRACE_HOURS:-24}
      Cleanup__DryRun: ${CLEANUP_DRY_RUN:-false}
      # IFC, mesh and point-cloud uploads are converted by the converter service (spec 9.2).
      Converter__Url: http://converter:8090
      # Logs: one JSON object per line (docker logs, log collectors); every line of a request carries its RequestId.
      Logging__Console__FormatterName: json
      Logging__Console__FormatterOptions__IncludeScopes: "true"
      Logging__Console__FormatterOptions__UseUtcTimestamp: "true"
      Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-ddTHH:mm:ss.fffZ"
      # Service tokens of organizations' MapManager connections: MapManager__Tokens__<ref>=mmst_… (spec 6.3) – in
      # api.env (below), not here.
      # Behind Caddy: HTTPS is known from X-Forwarded-Proto (the API is not exposed).
      ReverseProxy__TrustForwardedHeaders: "true"
      DataProtection__KeysPath: /data/keys
    # Secrets of the API outside git, e.g. the MapManager service tokens (MapManager__Tokens__<ref>=mmst_…); optional.
    env_file:
      - path: ./api.env
        required: false
    volumes:
      - dpkeys:/data/keys
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    networks: [backend, frontend]

  # Model converter (spec 9.2): IFC → segmented GLB, OBJ/FBX/DAE/STL/PLY/3DS → GLB, LAS/LAZ/E57 → 3D Tiles point cloud.
  # Internal only: the API gives it jobs, it reads and writes the object store. One conversion at a time.
  converter:
    logging: *logging
    build:
      context: ..
      dockerfile: converter/Dockerfile
    image: twin-converter:latest
    restart: unless-stopped
    environment:
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      S3_SECRET_KEY: ${STORAGE_SECRET_KEY}
      CONVERTER_MAX_POINTS: ${CONVERTER_MAX_POINTS:-30000000}
      # A ZIP upload unpacked at most this large (MB): a broken or malicious archive stops early.
      CONVERTER_MAX_UNPACKED_MB: ${CONVERTER_MAX_UNPACKED_MB:-20480}
    mem_limit: ${CONVERTER_MEMORY:-4g}
    depends_on:
      storage:
        condition: service_started
    networks: [backend]

  web:
    logging: *logging
    build: ../frontend
    image: twin-web:latest
    restart: unless-stopped
    environment:
      # The server's DNS name; Caddy requests a Let's Encrypt certificate for it (localhost: local certificate).
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      # Let's Encrypt sends notices here (e.g. expiring certificate). Required by the Caddyfile syntax.
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]

networks:
  # db and storage are only on the backend network: web (the internet-facing side) cannot reach them.
  backend:
  frontend:

volumes:
  pgdata:
  objects:
  dpkeys:
  caddy_data:
  caddy_config:
