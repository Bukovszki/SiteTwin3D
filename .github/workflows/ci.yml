name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Integration tests start a real PostGIS container (Testcontainers; Docker is available on the runner).
      - run: dotnet test --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npx ng test --watch=false

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^STORAGE_ACCESS_KEY=$/STORAGE_ACCESS_KEY=ci/; s/^STORAGE_SECRET_KEY=$/STORAGE_SECRET_KEY=ci/; s/^PLATFORM_ADMIN_PASSWORD=$/PLATFORM_ADMIN_PASSWORD=ci-password/' .env
          docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet
